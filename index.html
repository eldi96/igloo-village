<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이글루 시험 장면</title>
<style>
  html, body { margin: 0; height: 100%; background: #050d18; color: #eef6fb; font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
  .top { position: fixed; top: 20px; left: 24px; right: 24px; display: flex; justify-content: space-between; font-size: 13px; color: #e3edf4; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); pointer-events: none; }
  .top b { color: #f4fbff; font-size: 15px; font-weight: 500; }
  .bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; background: rgba(5, 13, 24, .72); border: 1px solid rgba(255, 255, 255, .14); font-size: 13px; white-space: nowrap; max-width: calc(100vw - 32px); }
  .bar button { font: inherit; color: #eef6fb; background: transparent; border: 1px solid rgba(255, 255, 255, .4); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  .bar button.primary { background: #eef6fb; color: #071320; border-color: #eef6fb; }
  .label { position: fixed; transform: translate(-50%, 0); padding: 1px 6px; border-radius: 5px; background: rgba(5, 13, 24, .62); font-size: 12px; color: #eef6fb; font-weight: 500; pointer-events: none; white-space: nowrap; }
  .tip { position: fixed; transform: translate(-50%, -130%); padding: 5px 9px; border-radius: 6px; background: #071320; font-size: 12px; pointer-events: none; display: none; white-space: nowrap; }
  .perf { position: fixed; left: 24px; bottom: 24px; padding: 6px 10px; border-radius: 7px; background: rgba(5, 13, 24, .72); font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; pointer-events: none; }

  .fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div class="top"><b>서비스 이름</b><span id="count"></span></div>
<div class="fade" id="fade"></div>
<div class="bar" id="bar" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<div class="perf" id="perf">측정 중…</div>
<div class="fallback" id="fallback">이 브라우저에서는 3D 화면을 띄울 수 없어요.</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 탭이 숨겨진 채로 열리면 창 크기가 0이라 카메라 값이 깨지므로 최소 1로 둔다
const W = () => Math.max(innerWidth, 1), H = () => Math.max(innerHeight, 1);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.setSize(W(), H());
// 지형과 건물은 움직이지 않으니 그림자는 필요할 때만 다시 그린다
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

// 매번 같은 마을이 나오도록 난수를 고정
let seed = 20261103;
const rng = () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const rand = (a, b) => a + rng() * (b - a);

const scene = new THREE.Scene();
const FOG = 0x12273a;
scene.fog = new THREE.FogExp2(FOG, 0.0058);
const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 1400);

// 지도 시점: 높이 떠서 마을과 오로라를 함께 보다가, 확대할수록 낮게 깔리며 가까워진다
const MIN_DIST = 11;
const START_ZOOM = 0.92;
const CENTER = { x: 0, z: -11 };
const view = { x: CENTER.x, z: CENTER.z, d: 0, maxD: 0 };
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
const closeness = () => (view.maxD - view.d) / (view.maxD - MIN_DIST);
const pitch = () => 0.27 - 0.11 * closeness();
const fitMap = () => {
  const far = 66 * Math.max(1, 1.55 / camera.aspect);
  view.d = view.maxD ? view.d / view.maxD * far : far * START_ZOOM;
  view.maxD = far;
};
const applyView = () => {
  const t = closeness();
  view.x = Math.min(Math.max(view.x, CENTER.x - 26 * t), CENTER.x + 26 * t);
  view.z = Math.min(Math.max(view.z, CENTER.z - 20 * t), CENTER.z + 20 * t);
  const p = pitch(), lift = 2 + 4 * (1 - t);
  camPos.set(view.x, Math.sin(p) * view.d + lift, view.z + Math.cos(p) * view.d);
  camLook.set(view.x, lift, view.z);
};
fitMap();
applyView();
const lookNow = camLook.clone();
camera.position.copy(camPos);
camera.lookAt(camLook);

// 달빛과, 오로라가 눈에 비치는 은은한 초록빛
scene.add(new THREE.HemisphereLight(0x5f86c4, 0x9fc4d6, 0.72));
const auroraGlow = new THREE.DirectionalLight(0x55d6a8, 0.32);
auroraGlow.position.set(10, 22, -60);
scene.add(auroraGlow);
const moon = new THREE.DirectionalLight(0xcfe0ff, 2.1);
moon.position.set(-34, 21, 12);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 130 });
moon.shadow.bias = -0.0005;
moon.shadow.normalBias = 0.06;
scene.add(moon);

const uTime = { value: 0 };

// 하늘: 지평선은 안개색과 이어지게
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, fog: false, depthWrite: false,
    vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
    fragmentShader: `varying vec3 p;
      void main(){
        float t = clamp(p.y * 2.4, 0., 1.);
        vec3 low = vec3(.0065, .0204, .0423), high = vec3(.0012, .0035, .011);
        gl_FragColor = vec4(mix(low, high, pow(t, .5)), 1.);
      }`
  })
));

// 별: 크기가 제각각이고 천천히 반짝인다
{
  const n = 1800, a = new Float32Array(n * 3), s = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = rng() * Math.PI * 2, ph = Math.asin(rng() * 0.96 + 0.02);
    a.set([900 * Math.cos(ph) * Math.cos(th), 900 * Math.sin(ph), 900 * Math.cos(ph) * Math.sin(th)], i * 3);
    s[i] = Math.pow(rng(), 3) * 2.6 + 0.8;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  g.setAttribute('size', new THREE.BufferAttribute(s, 1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, uniforms: { t: uTime },
    vertexShader: `attribute float size; uniform float t; varying float a;
      void main(){ a = .55 + .45 * sin(t * .8 + position.x * .7);
      gl_PointSize = size; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: 'varying float a; void main(){ float d = length(gl_PointCoord - .5); gl_FragColor = vec4(vec3(.9, .95, 1.) * a, smoothstep(.5, .2, d)); }'
  })));
}

// 오로라: 노이즈로 일렁이는 빛의 커튼. 아래 경계는 또렷하고 위로 갈수록 옅어진다
const auroraMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false,
  uniforms: { t: uTime },
  vertexShader: `uniform float t; varying vec2 v;
    void main(){ v = uv; vec3 q = position;
    q.z += sin(q.x * .012 + t * .06) * 46. + sin(q.x * .031 - t * .045) * 17.;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(q, 1.); }`,
  fragmentShader: `uniform float t; varying vec2 v;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 3; i++) { s += a * n(p); p = p * 2.03 + 7.1; a *= .5; } return s; }
    void main(){
      float wob = fbm(vec2(v.x * 5. + t * .03, t * .05)) * .34;
      float y = v.y - wob;
      float rays = pow(fbm(vec2(v.x * 46. + t * .07, t * .1 + y * .9)), 1.6) * 2.5;
      float band = smoothstep(.02, .09, y) * pow(max(1. - y, 0.), 3.);
      float gaps = smoothstep(.22, .62, fbm(vec2(v.x * 3.4 - t * .02, 3.)));
      float e = smoothstep(0., .1, v.x) * smoothstep(1., .9, v.x);
      vec3 c = mix(vec3(.05, 1., .52), vec3(.42, .22, 1.), smoothstep(.12, .62, y));
      c += vec3(.9, .1, .4) * smoothstep(.01, .05, y) * smoothstep(.1, .04, y) * .14;
      gl_FragColor = vec4(c * band * rays * gaps * e * .62, 1.);
    }`
});
[[-40, 150, -390, -0.12, 1.25], [60, 175, -470, 0.16, 1.5]].forEach(([x, y, z, rot, s]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(760 * s, 300 * s, 180, 1), auroraMat);
  m.position.set(x, y, z);
  m.rotation.y = rot;
  scene.add(m);
});

// 노이즈
const smooth = (a, b, x) => {
  const t = Math.min(Math.max((x - a) / (b - a), 0), 1);
  return t * t * (3 - 2 * t);
};
const hash = (x, y) => {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
};
// per를 주면 텍스처가 이어지도록 격자를 반복
const noise = (x, y, per = 0) => {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const h = (a, b) => per ? hash(((a % per) + per) % per, ((b % per) + per) % per) : hash(a, b);
  const top = h(xi, yi) * (1 - u) + h(xi + 1, yi) * u;
  const bot = h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u;
  return top * (1 - v) + bot * v;
};
const fbm = (x, y, oct) => {
  let sum = 0, amp = 0.5;
  for (let i = 0; i < oct; i++) {
    sum += amp * noise(x, y);
    x = x * 2.03 + 17.1;
    y = y * 2.03 + 9.2;
    amp *= 0.5;
  }
  return sum;
};
const ridged = (x, y, oct) => {
  let sum = 0, amp = 0.55;
  for (let i = 0; i < oct; i++) {
    const n = 1 - Math.abs(noise(x, y) * 2 - 1);
    sum += amp * n * n;
    x = x * 2.1 + 31.7;
    y = y * 2.1 + 5.3;
    amp *= 0.5;
  }
  return sum;
};

// 이글루 자리
const R = 1.9;
const HUB = { x: 0, z: 4.5 };
// 앞뒤 열의 x를 엇갈려 앞 이글루가 뒤 이글루를 가리지 않게 한다
// 양옆 끝에 몰리지 않도록 가운데에 모으고, 많아지면 뒤쪽으로 늘린다
const ROWS = [
  [-31, [-32, -19.5, -6.5, 6.5, 19.5, 32]],
  [-23, [-26, -13, 0, 13, 26]],
  [-15, [-19.5, -6.5, 6.5, 19.5, 32]],
  [-7, [-26, -13, 0, 13, 26]],
  [1, [-33, -21, [-8.5, 9.5], 12, 21, 33]],
  [9, [-27, -14.5, 14.5, 27]]
];
const LIGHTHOUSE = { x: -33, z: -15, radius: 2.2 };
// 행에서 벗어나는 이글루는 [x, z]로 직접 적는다
const places = ROWS.flatMap(([z0, xs]) => xs.map(x0 => Array.isArray(x0) ? x0 : [x0, z0])).map(([x0, z0]) => {
  const x = x0 + rand(-0.9, 0.9), z = z0 + rand(-0.9, 0.9);
  // 입구는 대체로 화면 쪽을 보되 조금씩 어긋나게
  const yaw = Math.atan2(-x * 0.3, 44 - z) + rand(-0.2, 0.2);
  return { x, z, yaw, radius: R, doorX: x + Math.sin(yaw) * (R + 2), doorZ: z + Math.cos(yaw) * (R + 2) };
});

// 지형: 부드럽게 굴곡진 눈밭을 뒤쪽과 옆쪽 산맥이 둘러싼다
const rawH = (x, z) => {
  const rolling = (fbm(x * 0.045 + 3, z * 0.045 + 8, 4) - 0.47) * 2.1 + (fbm(x * 0.3, z * 0.3, 3) - 0.44) * 0.12;
  const away = Math.max(smooth(-46, -96, z), smooth(55, 112, Math.abs(x)) * smooth(55, -5, z));
  const peaks = Math.pow(ridged(x * 0.017 + 4, z * 0.017 + 2, 6), 1.3) * 44 * away;
  return rolling + peaks;
};
const FLAT = [{ x: HUB.x, z: HUB.z, y: 0.2, r0: 8, r1: 14 }, { x: LIGHTHOUSE.x, z: LIGHTHOUSE.z, y: 0.2, r0: 3.5, r1: 7 }, ...places.map(p => ({ x: p.x, z: p.z, y: 0.2, r0: 3.2, r1: 7 }))];
const heightAt = (x, z) => {
  let h = rawH(x, z);
  for (const f of FLAT) {
    const d = Math.hypot(x - f.x, z - f.z);
    if (d < f.r1) h += (f.y - h) * (1 - smooth(f.r0, f.r1, d));
  }
  const edge = Math.min(150 - Math.abs(x), z + 170, 75 - z);
  return h * smooth(0, 16, edge);
};

const makeSnowBump = () => {
  const size = 512, per = 64, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d'), img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size * per, v = y / size * per;
    const n = noise(u / 4, v / 4, per / 4) * 0.5 + noise(u, v, per) * 0.3 + noise(u * 2, v * 2, per * 2) * 0.14 + noise(u * 4, v * 4, per * 4) * 0.06;
    const b = n * 255, i = (x + y * size) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = b;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
};
const snowBump = makeSnowBump();
{
  const snow = new THREE.Color(0xeaf2f9), hollow = new THREE.Color(0xb5cbe2), rock = new THREE.Color(0x34404d), c = new THREE.Color();
  const warp = (t, a) => a * t + (1 - a) * t * t * t;
  // place는 -1~1 격자 좌표를 실제 위치로 바꾼다
  const buildGround = (segX, segZ, place, y0) => {
    const g = new THREE.PlaneGeometry(2, 2, segX, segZ);
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, uv = g.attributes.uv, v2 = new THREE.Vector2();
    for (let i = 0; i < p.count; i++) {
      place(p.getX(i), p.getZ(i), v2);
      p.setXYZ(i, v2.x, heightAt(v2.x, v2.y) + y0, v2.y);
      uv.setXY(i, (v2.x + 150) / 300, (v2.y + 170) / 245);
    }
    g.computeVertexNormals();
    // 가파른 곳은 바위가 드러나고, 움푹한 곳은 푸르스름한 그늘이 진다
    const n = g.attributes.normal, colors = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
      const shade = smooth(0.54, 0.34, fbm(x * 0.09, z * 0.09, 3));
      const crag = (1 - smooth(0.62, 0.8, n.getY(i))) * smooth(2.5, 5, y);
      c.copy(snow).lerp(hollow, shade * 0.6).lerp(rock, crag * (0.55 + fbm(x * 0.6, z * 0.6, 2) * 0.6));
      colors.set([c.r, c.g, c.b], i * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    return g;
  };
  // 마을과 앞쪽 산: 격자를 가운데로 모으고 눈 요철과 그림자까지 그린다
  snowBump.repeat.set(30, 24);
  const NEAR_BACK = -100, NEAR_FRONT = 75, NEAR_MID = (NEAR_BACK + NEAR_FRONT) / 2, NEAR_HALF = (NEAR_FRONT - NEAR_BACK) / 2;
  const near = new THREE.Mesh(
    buildGround(300, 200, (u, w, out) => out.set(warp(u, 0.42) * 150, NEAR_MID + warp(w, 0.8) * NEAR_HALF), 0),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, bumpMap: snowBump, bumpScale: 1.5 })
  );
  near.receiveShadow = true;
  near.castShadow = true;
  scene.add(near);
  // 제일 뒤쪽 산만 격자를 성기게 하고, 눈 요철과 그림자 없이 가벼운 재질로 그린다
  const FAR_BACK = -170, FAR_FRONT = -96, FAR_MID = (FAR_BACK + FAR_FRONT) / 2, FAR_HALF = (FAR_FRONT - FAR_BACK) / 2;
  scene.add(new THREE.Mesh(
    buildGround(180, 50, (u, w, out) => out.set(u * 150, FAR_MID + w * FAR_HALF), -0.03),
    new THREE.MeshLambertMaterial({ vertexColors: true })
  ));

  // 격자 바깥을 채우는 눈밭. 안개 속으로 사라져 끝이 보이지 않는다
  const outer = new THREE.Mesh(new THREE.CircleGeometry(1000, 48), new THREE.MeshStandardMaterial({ color: 0xeaf2f9, roughness: 0.85 }));
  outer.rotation.x = -Math.PI / 2;
  outer.position.y = -0.04;
  scene.add(outer);
}

// 내리는 눈
{
  const n = 1100, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) a.set([(rng() - .5) * 90, rng() * 34, (rng() - .5) * 90], i * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, uniforms: { t: uTime },
    vertexShader: `uniform float t;
      void main(){ vec3 q = position; q.y = mod(q.y - t * (.7 + fract(position.x) * .6), 34.);
      q.x += sin(t * .4 + position.z) * .8;
      vec4 mv = modelViewMatrix * vec4(q, 1.); gl_PointSize = 95. / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: 'void main(){ float d = length(gl_PointCoord - .5); gl_FragColor = vec4(.85, .92, 1., smoothstep(.5, .1, d) * .55); }'
  })));
}

const snowfall = scene.children[scene.children.length - 1];

// 이글루
const OWNERS = { 1: ['김OO', 0xe2583e], 4: ['이OO', 0x3f8ae0], 7: ['박OO', 0x1fae80], 10: ['한OO', 0x8a6fe0], 13: ['최OO', 0xe0558c], 16: ['정OO', 0xe0a030], 19: ['오OO', 0x18a0a0], 22: ['윤OO', 0x534ab7] };
const blocks = [];
const dummy = new THREE.Object3D();
const pushBlock = (M, tint) => {
  dummy.updateMatrix();
  blocks.push({ m: M.clone().multiply(dummy.matrix), c: tint });
};
const domeInner = new THREE.SphereGeometry(R * 0.9, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);
const moundGeo = new THREE.SphereGeometry(1, 32, 10);
const moundMat = new THREE.MeshStandardMaterial({ color: 0xeaf2f9, roughness: 0.8, bumpMap: snowBump, bumpScale: 1.2 });

const gateGeo = (() => {
  const paint = (g, hex) => {
    const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
    return g;
  };
  const parts = [];
  const tones = [0x7a5230, 0x85603a, 0x6f4a2a, 0x80593a, 0x74502e];
  // 판자 윗변을 아치 곡선대로 잘라 입구를 빈틈없이 막는다. 가장자리는 터널 벽 속으로 묻힌다
  const GATE_R = 0.8, BOTTOM = 0.12, WIDTH = GATE_R * 2 / 5;
  for (let i = 0; i < 5; i++) {
    const x0 = -GATE_R + i * WIDTH + 0.006, x1 = -GATE_R + (i + 1) * WIDTH - 0.006;
    const plankShape = new THREE.Shape();
    plankShape.moveTo(x0, BOTTOM);
    plankShape.lineTo(x1, BOTTOM);
    for (let s = 0; s <= 8; s++) {
      const x = x1 + (x0 - x1) * s / 8;
      plankShape.lineTo(x, TUNNEL_LIFT + Math.sqrt(Math.max(GATE_R * GATE_R - x * x, 0)));
    }
    plankShape.closePath();
    const plank = new THREE.ExtrudeGeometry(plankShape, { depth: 0.07, bevelEnabled: false });
    plank.translate(0, 0, -0.035);
    parts.push(paint(plank, tones[i]));
  }
  for (const y of [0.5, 0.92]) {
    const bar = new THREE.BoxGeometry(y > 0.8 ? 1.12 : 1.5, 0.1, 0.05);
    bar.translate(0, y, 0.055);
    parts.push(paint(bar.toNonIndexed(), 0x4d331d));
  }
  const handle = new THREE.BoxGeometry(0.07, 0.17, 0.06);
  handle.translate(0.42, 0.7, 0.06);
  parts.push(paint(handle.toNonIndexed(), 0x23262a));
  return mergeGeometries(parts);
})();

const watchSpeed = () => {
  const now = performance.now(), gap = now - statLast;
  statLast = now;
  // 탭이 숨겨져 멈췄던 구간은 느린 기기로 오해하지 않게 건너뛴다
  if (document.hidden || gap > 3000) { statFrames = 0; statStart = now; return; }
  statFrames++;
  if (now - statStart < 2000) return;
  stats.fps = Math.round(statFrames / ((now - statStart) / 1000));
  statFrames = 0;

  if (stats.fps < 28 && stats.level < QUALITY_STEPS.length) QUALITY_STEPS[stats.level++]();
  // 시험용 표시. 공개할 때는 이 줄과 #perf를 지운다
  perfEl.textContent = `${stats.fps} FPS · 품질 ${QUALITY_STEPS.length - stats.level}/${QUALITY_STEPS.length} · 삼각형 ${Math.round(stats.triangles / 10000)}만`;

const zoomAt = (cx, cy, factor) => {
  const next = Math.min(Math.max(view.d * factor, MIN_DIST), view.maxD);
  const at = groundAt(cx, cy);
  if (at) {
    const s = 1 - next / view.d;
    view.x += (at.x - view.x) * s;
    view.z += (at.z - view.z) * s;
  }
  view.d = next;
  applyView();
};
canvas.addEventListener('wheel', e => {

  if (mode === 'map') zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.0013));
}, { passive: false });

const touches = new Map();
let dragged = false, pinch = 0;
canvas.addEventListener('pointerdown', e => {
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  dragged = false;
  pinch = 0;
});
const release = e => {
  touches.delete(e.pointerId);
  pinch = 0;
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
addEventListener('pointermove', e => {
  pointer.set(e.clientX / W() * 2 - 1, -(e.clientY / H()) * 2 + 1);
  mx = pointer.x; my = pointer.y;
  tip.style.left = e.clientX + 'px';
  tip.style.top = e.clientY + 'px';
  const held = touches.get(e.pointerId);
  if (!held || mode !== 'map') return;
  const dx = e.clientX - held.x, dy = e.clientY - held.y;
  if (touches.size === 2) {
    held.x = e.clientX;
    held.y = e.clientY;
    const [a, b] = [...touches.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch / dist);
    pinch = dist;
    dragged = true;
    return;
  }
  if (!dragged && Math.hypot(dx, dy) < 5) return;
  dragged = true;
  held.x = e.clientX;
  held.y = e.clientY;
  const unit = 2 * view.d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / H();
  view.x -= dx * unit;
  view.z -= dy * unit / Math.max(Math.sin(pitch()), 0.3);
  applyView();
});

function focusOn(ig) {
  mode = 'in';
  tip.style.display = 'none';
  ring.visible = false;
  hovered = null;
  canvas.style.cursor = '';
  const { x, z } = ig.group.position, yaw = ig.group.rotation.y, DIST = ig.house ? 17 : 8.5;
  let best = null;
  for (const off of [0, 0.25, -0.25, 0.5, -0.5]) {
    const a = yaw + off, cx = x + Math.sin(a) * DIST, cz = z + Math.cos(a) * DIST;
    const room = places.reduce((min, p) => {
      if (p.x === x && p.z === z) return min;
      const dx = cx - x, dz = cz - z;
      const t = Math.min(Math.max(((p.x - x) * dx + (p.z - z) * dz) / (dx * dx + dz * dz), 0), 1);
      return Math.min(min, Math.hypot(p.x - x - dx * t, p.z - z - dz * t));
    }, Infinity);
    if (!best || room > best.room) best = { room, cx, cz };
    if (room > R * 1.15) break;
  }
  camPos.set(best.cx, 2.6, best.cz);
  camLook.set(x, ig.house ? 5.5 : 1.5, z);
}

  if (!room) {
    room = (await import('./room.js')).createRoom();
    room.setAspect(W() / H());
  }
  ig.gate.visible = false;
  fadeThrough(() => {
    mode = 'room';
    renderPass.scene = room.scene;
    renderPass.camera = room.camera;
    setBar(`${ig.mine ? '내' : ig.owner + '의'} 이글루 안이에요`, [['밖으로 나가기', () => goOutside(ig), true]]);
  });
}
function goOutside(ig) {
  fadeThrough(() => {
    ig.gate.visible = true;
    renderPass.scene = scene;
    renderPass.camera = camera;
    mode = 'in';
    setBar(`${ig.mine ? '내' : ig.owner + '의'} 이글루 앞이에요`, [['안으로 들어가기', () => goInside(ig), true], ['마을로 돌아가기', leave]]);
  });
}
function leave() {
  mode = 'map';
  applyView();
  setBar(mine ? '깃발이 있는 이글루를 눌러 구경해 보세요' : IDLE);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && mode === 'in') leave(); });

const v = new THREE.Vector3();
const clock = new THREE.Clock();
renderer.info.autoReset = false;
function frame() {
  // 프레임이 낮은 기기에서도 카메라 이동 시간이 늘어지지 않게 상한을 넉넉히 둔다
  const dt = Math.min(clock.getDelta(), 0.25), t = clock.elapsedTime;
  if (mode === 'room') {
    room.update(t, mx, my);
    renderer.info.reset();
    composer.render();
    stats.triangles = renderer.info.render.triangles;
    stats.calls = renderer.info.render.calls;
    watchSpeed();
    igloos.forEach(ig => { if (ig.label) ig.label.style.display = 'none'; });
    requestAnimationFrame(frame);
    return;
  }
  uTime.value = t;
  if (village) village.update(t);

  flags.forEach(f => {
    const p = f.cloth.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = f.base[i * 3];
      p.setZ(i, Math.sin(x * 5 - t * 3.2 + f.phase) * 0.09 * x);
    }
    p.needsUpdate = true;
  });
  if (raising) {
    raising.t = Math.min(raising.t + dt / 0.7, 1);
    raising.g.scale.y = 1 - Math.pow(1 - raising.t, 3);
    if (raising.t === 1) raising = null;
  }

  const k = 1 - Math.exp(-dt * (mode === 'map' ? 7 : 2.4));
  const still = mode !== 'map' || touches.size > 0;
  const px = still ? 0 : mx * 0.025 * view.d, py = still ? 0 : my * 0.012 * view.d;
  camera.position.lerp(v.set(camPos.x + px, camPos.y + py, camPos.z), k);
  lookNow.lerp(camLook, k);
  camera.lookAt(lookNow);

  if (mode === 'map') {
    const ig = pick();
    if (ig !== hovered) {
      hovered = ig;
      ring.visible = !!ig;
      canvas.style.cursor = ig ? 'pointer' : '';
      tip.style.display = ig ? 'block' : 'none';
      if (ig) {
        ring.position.set(ig.group.position.x, 0.5, ig.group.position.z);
        tip.textContent = ig.house ? '등대' : ig.mine ? '내 이글루' : ig.owner ? `${ig.owner}의 이글루` : '빈 이글루';
      }
    }
  }

  igloos.forEach(ig => {
    if (!ig.label) return;
    v.copy(ig.bottom).project(camera);
    const show = mode === 'map' && v.z < 1;
    ig.label.style.display = show ? 'block' : 'none';
    if (show) {
      ig.label.style.left = (v.x * .5 + .5) * W() + 'px';
      ig.label.style.top = (-v.y * .5 + .5) * H() + 'px';
    }
  });

  renderer.info.reset();
  composer.render();
  stats.triangles = renderer.info.render.triangles;
  stats.calls = renderer.info.render.calls;
  watchSpeed();
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  fitMap();
  if (mode === 'map') applyView();
  if (room) room.setAspect(W() / H());
  renderer.setSize(W(), H());
  composer.setSize(W(), H());
});
</script>
</body>
</html>
